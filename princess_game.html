<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公主大戰小怪獸 - 打地鼠遊戲</title>
    <style>
        :root {
            --princess-pink: #ffcce6;
            --princess-dark: #ff66b2;
            --princess-gold: #ffd700;
            --monster-color: #9933ff;
            --hole-color: #663300;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff99cc, #ffccff);
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><text y="24" font-size="24">🪄</text></svg>'), auto;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 10px var(--princess-dark);
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 50px;
            font-size: 1.5rem;
            color: #ff3399;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 150px);
            grid-template-rows: repeat(3, 120px);
            gap: 20px;
        }

        .hole {
            width: 150px;
            height: 120px;
            background: var(--hole-color);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #4d2600;
        }

        .monster {
            width: 100px;
            height: 100px;
            background: var(--monster-color);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            bottom: -100px;
            left: 25px;
            transition: bottom 0.1s ease-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        /* 怪獸的眼睛 */
        .monster::before, .monster::after {
            content: '';
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 30px;
        }
        .monster::before { left: 30px; }
        .monster::after { right: 30px; }

        .monster-eye-inner {
            width: 6px;
            height: 6px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 33px;
        }
        .left-eye { left: 33px; }
        .right-eye { right: 33px; }

        .monster.up {
            bottom: 10px;
        }

        .monster.whacked {
            animation: whack 0.3s forwards;
        }

        @keyframes whack {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); background: #ffcc00; }
            100% { transform: scale(0); opacity: 0; }
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: var(--princess-dark);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        button.secondary {
            background: #ff99cc;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        button:hover:not(:disabled) {
            transform: scale(1.1);
            background: #ff3399;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            background: white;
            border-radius: 50%;
            animation: sparkle-anim 0.5s forwards;
        }

        @keyframes sparkle-anim {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* 暫停提示文字 */
        #pause-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 153, 204, 0.4);
            backdrop-filter: blur(5px);
            color: white;
            font-size: 5rem;
            font-weight: bold;
            text-shadow: 0 0 20px var(--princess-dark);
            align-items: center;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }

        /* 遊戲結束覆蓋層 */
        #game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

    </style>
</head>
<body>

    <h1>✨ 公主大戰小怪獸 ✨</h1>

    <div class="stats">
        <div>分數: <span id="score">0</span></div>
        <div>時間: <span id="timer">30</span>s</div>
    </div>

    <div class="game-board">
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
        <div class="hole"><div class="monster">
            <div class="monster-eye-inner left-eye"></div>
            <div class="monster-eye-inner right-eye"></div>
        </div></div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="startGame()">開始冒險！</button>
        <button id="pause-btn" class="secondary" onclick="togglePause()" disabled>暫停</button>
    </div>

    <div id="pause-overlay">休息一下 🎀</div>

    <div id="game-over">
        <h2 style="font-size: 3rem;">魔法時間結束！</h2>
        <p style="font-size: 2rem;">妳總共擊退了 <span id="final-score">0</span> 隻怪獸！</p>
        <button onclick="hideGameOver()">再次挑戰</button>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.querySelector('#score');
        const monsters = document.querySelectorAll('.monster');
        const timerDisplay = document.querySelector('#timer');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const pauseBtn = document.getElementById('pause-btn');
        const startBtn = document.getElementById('start-btn');
        const pauseOverlay = document.getElementById('pause-overlay');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let timeLeft = 30;
        let timerId;
        let isPaused = false;
        let peepTimeout;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            if (isPaused || timeUp) return;
            
            const time = randomTime(500, 1000);
            const hole = randomHole(holes);
            const monster = hole.querySelector('.monster');
            monster.classList.remove('whacked');
            monster.classList.add('up');
            
            peepTimeout = setTimeout(() => {
                monster.classList.remove('up');
                if (!timeUp && !isPaused) peep();
            }, time);
        }

        function startGame() {
            scoreBoard.textContent = 0;
            score = 0;
            timeUp = false;
            isPaused = false;
            timeLeft = 30;
            timerDisplay.textContent = timeLeft;
            gameOverScreen.style.display = 'none';
            pauseBtn.disabled = false;
            pauseBtn.textContent = '暫停';
            startBtn.disabled = true;

            peep();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerId);
            timerId = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    timerDisplay.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        timeUp = true;
                        pauseBtn.disabled = true;
                        startBtn.disabled = false;
                        showGameOver();
                    }
                }
            }, 1000);
        }

        function togglePause() {
            if (timeUp) return;
            
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = '繼續';
                pauseOverlay.style.display = 'flex';
                clearTimeout(peepTimeout);
                // 讓所有怪獸縮回去
                monsters.forEach(m => m.classList.remove('up'));
            } else {
                pauseBtn.textContent = '暫停';
                pauseOverlay.style.display = 'none';
                peep();
            }
        }

        function bonk(e) {
            if(!e.isTrusted || isPaused) return; 
            if(!this.classList.contains('up')) return; 
            
            score++;
            this.classList.remove('up');
            this.classList.add('whacked');
            scoreBoard.textContent = score;

            createSparkle(e.pageX, e.pageY);
        }

        function createSparkle(x, y) {
            for(let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                sparkle.style.setProperty('--tx', tx + 'px');
                sparkle.style.setProperty('--ty', ty + 'px');
                sparkle.style.backgroundColor = ['#ffcc00', '#ff66b2', '#ffffff'][Math.floor(Math.random()*3)];
                sparkle.style.width = sparkle.style.height = (Math.random() * 10 + 5) + 'px';
                
                document.body.appendChild(sparkle);
                
                // 動畫效果
                sparkle.animate([
                    { transform: 'translate(0, 0)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px)`, opacity: 0 }
                ], {
                    duration: 500,
                    easing: 'ease-out'
                });

                setTimeout(() => sparkle.remove(), 500);
            }
        }

        function showGameOver() {
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        function hideGameOver() {
            gameOverScreen.style.display = 'none';
            startGame();
        }

        monsters.forEach(monster => monster.addEventListener('click', bonk));

    </script>
</body>
</html>
